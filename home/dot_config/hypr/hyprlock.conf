# Палитра цветов
$lock_field = rgba(595959ee)
$lock_accent = rgb(33ccff)
$lock_text = rgb(eeeeee)

# Размытый фон; пустой monitor применяет элемент ко всем мониторам
background {
    monitor =
    path = /usr/share/hypr/wall2.png

    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Поле пароля
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    # Размер маркера относительно высоты поля и промежуток относительно размера маркера
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    outer_color = $lock_field
    inner_color = $lock_field
    font_color = $lock_accent
    # Плавно скрывать поле, пока пароль не вводится
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false

    position = 0, 140
    halign = center
    valign = bottom
}

# Часы выше центра экрана, дата ниже - оставляем зазор для крупного шрифта и тени
label {
    monitor =
    text = cmd[update:1000] date +'<b><big> %H:%M:%S </big></b>'
    color = $lock_accent
    font_size = 64
    font_family = JetBrains Mono Nerd Font 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 80
    halign = center
    valign = center
}

# Дата под часами; обновляется раз в минуту, включая смену дня после полуночи
label {
    monitor =
    text = cmd[update:60000] date +'<b> %A, %-d %B %Y </b>'
    color = $lock_text
    font_size = 24
    font_family = JetBrains Mono Nerd Font 10

    position = 0, -40
    halign = center
    valign = center
}

# Имя пользователя под полем пароля
label {
    monitor =
    text = Hey $USER
    color = $lock_text
    font_size = 18
    font_family = Inter Display Medium

    position = 0, 30
    halign = center
    valign = bottom
}
