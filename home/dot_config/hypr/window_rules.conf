# See https://wiki.hyprland.org/Configuring/Window-Rules/

# windowrule = suppressevent maximize, class:.* # You'll probably like this.
# windowrule = float,class:(pavucontrol)
# windowrule = maximize,class:(org.gnome.Meld)
# windowrule = float,class:(waypaper)
# windowrule = workspace 3,class:(code)
# windowrule = float,class:(code),title:(Save As|Open File|Open Folder|Open)
# windowrule = float,class:(doublecmd),title:(Поиск файлов|~/.*|/.*)
# windowrule = float,class:(terminator),title:(Терминатор Параметры|Настройки)
# windowrule = float,class:(nm-connection-editor)
# windowrule = float,class:(runify-ui)
# windowrule = float,class:(VoiceAssistant)
# windowrule = minsize 800 600 float, class:(Runix)

# Игнорировать запросы на maximize от приложений (старое suppressevent maximize)
windowrule {
    name = ignore-maximize
    match:class = .*
    suppress_event = maximize
}

# Float для конкретных классов
windowrule = float on, match:class ^(pavucontrol)$
windowrule = maximize on, match:class ^(org\.gnome\.Meld)$
windowrule = float on, match:class ^(waypaper)$
windowrule = workspace 3, match:class ^(code)$

# Float по классу + тайтлу
windowrule = float on, match:class ^(code)$, match:title ^(Save As|Open File|Open Folder|Open)$
windowrule = float on, match:class ^(doublecmd)$, match:title ^(Поиск файлов|~/.*|/.*)$
windowrule = float on, match:class ^(terminator)$, match:title ^(Терминатор Параметры|Настройки)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(runify-ui)$
windowrule = float on, match:class ^(VoiceAssistant)$

# Minsize + float
windowrule = min_size 800 600, match:class ^(Runix)$
windowrule = float on, match:class ^(Runix)$

# Quake-терминал запускается скрытым; скрипт переносит его на текущий workspace.
windowrule = float on, match:class ^(kitty-quake)$
windowrule = workspace special:quake silent, match:class ^(kitty-quake)$
# Движением управляет скрипт; штатная анимация не должна накладываться поверх.
windowrule = no_anim on, match:class ^(kitty-quake)$
