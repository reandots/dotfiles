# Эти команды выполняются один раз при входе в Hyprland, не при reload.

# Восстановление обоев, индикатор сети и пользовательское управление вентиляторами NVIDIA.
exec-once = waypaper --restore &
exec-once = nm-applet --indicator
exec-once = nvidiafan.sh

# Передать Wayland-дисплей и имя окружения в D-Bus и пользовательский systemd.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# История буфера обмена: отдельные наблюдатели для текста и изображений.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Стартовые приложения: silent не переключает фокус на их стол, noanim убирает анимацию.
exec-once = [workspace 1 silent; noanim] firefox
exec-once = [workspace 2 silent; noanim] $terminal
exec-once = [workspace 3 silent; noanim] code

# Панель\оболочка
exec-once = auto_ags &

# Запросы переключения столов при входе: сохранён прежний порядок 7 → 1.
exec-once = hyprctl dispatch workspace 7
exec-once = hyprctl dispatch workspace 6
exec-once = hyprctl dispatch workspace 5
exec-once = hyprctl dispatch workspace 4
exec-once = hyprctl dispatch workspace 3
exec-once = hyprctl dispatch workspace 2
exec-once = hyprctl dispatch workspace 1
