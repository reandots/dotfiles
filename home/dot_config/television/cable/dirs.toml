[metadata]
name = "dirs"
description = "A channel to select from directories"
requirements = ["fd", "realpath"]

[source]
command = [
  { name = "Default", run = "fd --type d --hidden --exclude .git" },
  { name = "Symlink", run = "fd --type d --follow --hidden --exclude .git" },
  { name = "All", run = "fd --type d --follow --hidden --no-ignore" },
]

[preview]
command = "ls -la --color=always '{}'"

[keybindings]
shortcut = "f2"
ctrl-o = "actions:cd"
ctrl-up = "actions:goto_parent_dir"
alt-enter = "actions:absolute_path"

[actions.cd]
description = "Change directory in the calling zsh (requires _tv integration)"
# Return NUL-delimited absolute paths without changing normal tv output.
command = """
if [ -z "$TV_CD_FILE" ]; then printf '%s\\n' 'tv: Ctrl-O requires the zsh _tv integration' >&2; exit 1; fi
realpath --zero --no-symlinks -- {split:\\n:..|map:{replace:s/'/'"'"'/g|prepend:'|append:'}|join: } > "$TV_CD_FILE"
"""
separator = "\n"
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv dirs .."
mode = "execute"

[actions.absolute_path]
description = "Output absolute paths without resolving symlinks and exit"
# Quote each selected path separately, including embedded apostrophes.
command = """realpath --no-symlinks -- {split:\\n:..|map:{replace:s/'/'"'"'/g|prepend:'|append:'}|join: }"""
separator = "\n"
mode = "execute"
