[metadata]
name = "env"
description = "A channel to select from environment variables"

[source]
command = [
  { name = "All", run = "printenv" },
  { name = "XDG", run = "printenv | grep '^XDG_'" },
  { name = "GO", run = "printenv | grep '^GO'" },
]
output = "{split:=:1..}"

[preview]
command = "echo '{split:=:1..}'"

[ui]
layout = "portrait"
preview_panel = { size = 20, header = "{split:=:0}" }

[keybindings]
shortcut = "f4"
enter = "confirm_selection"
alt-enter = "actions:name"

[actions.name]
description = "Output the variable reference ($NAME) instead of the value"
command = "printf '$%s\\n' '{split:=:0}'"
mode = "execute"
