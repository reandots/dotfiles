tick_rate = 50
default_channel = "files"
shell = "bash"
# История поисковых запросов tv (не история команд shell).
history_size = 200
global_history = false

[ui]
ui_scale = 100
orientation = "landscape"
theme = "default"

[ui.input_bar]
position = "top"
prompt = ">"
border_type = "rounded"

[ui.status_bar]
separator_open = ""
separator_close = ""
hidden = false

[ui.results_panel]
border_type = "rounded"

[ui.preview_panel]
size = 50
scrollbar = true
border_type = "rounded"
hidden = false

[ui.help_panel]
show_categories = true
hidden = true

[ui.remote_control]
show_channel_descriptions = true
sort_alphabetically = true

[keybindings]
esc = "quit"
ctrl-c = "quit"

ctrl-s = "cycle_sources"
ctrl-r = "reload_source"
ctrl-y = "copy_entry_to_clipboard"
ctrl-b = "toggle_preview"
ctrl-h = "toggle_help"
ctrl-t = "toggle_remote_control"
ctrl-x = "toggle_action_picker"
ctrl-l = "toggle_layout"
f12 = "toggle_status_bar"

down = "select_next_entry"
up = "select_prev_entry"
backspace = "delete_prev_char"
delete = "delete_next_char"
ctrl-k = "delete_line"
home = "go_to_input_start"
end = "go_to_input_end"
left = "go_to_prev_char"
right = "go_to_next_char"

pagedown = "scroll_preview_half_page_down"
pageup = "scroll_preview_half_page_up"
ctrl-f = "cycle_previews"

tab = "toggle_selection_down"
backtab = "toggle_selection_up"
enter = "confirm_selection"

ctrl-up = "select_prev_history"
ctrl-down = "select_next_history"

ctrl-n = "no_op"
ctrl-j = "no_op"
ctrl-p = "no_op"
ctrl-o = "no_op"
ctrl-a = "no_op"
ctrl-e = "no_op"
ctrl-w = "no_op"
ctrl-u = "no_op"

[shell_integration]
fallback_channel = "files"

[shell_integration.channel_triggers]
# Канал → команды: выбор по Ctrl-Space в командной строке.
"alias" = ["alias", "unalias"]
"env" = ["export", "unset"]
"dirs" = ["cd", "ls", "rmdir", "z"]
"files" = [
  "cat",
  "less",
  "head",
  "tail",
  "vim",
  "nano",
  "micro",
  "bat",
  "cp",
  "mv",
  "rm",
  "touch",
  "chmod",
  "chown",
  "ln",
  "tar",
  "zip",
  "unzip",
  "gzip",
  "gunzip",
  "xz",
]
"git-diff" = ["git add", "git restore"]
"git-branch" = [
  "git checkout",
  "git switch",
  "git branch",
  "git merge",
  "git rebase",
  "git pull",
  "git push",
]
"git-log" = ["git log", "git show"]
"git-stash" = ["git stash apply", "git stash pop", "git stash drop"]
"make-targets" = ["make"]
"docker-images" = ["docker run"]
"git-repos" = ["nvim", "code", "hx", "git clone"]

[shell_integration.keybindings]
# Виджет — в app/television.zsh; фактическая привязка — в lib/key_bindings.zsh.
"smart_autocomplete" = "ctrl-space"
# Ctrl-R обслуживает Atuin. Отсутствие command_history не отключает Ctrl-R
# в стандартном `tv init zsh` 0.15.9; не подключаем его вместе с нашей интеграцией.
