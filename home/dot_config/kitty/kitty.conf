# Local configuration for the Arch Linux kitty package.
# See https://sw.kovidgoyal.net/kitty/conf.html

# Shared settings and unchanged fonts / Solarized Dark colors.
include base.conf
include current-theme.conf

# Native Kitty panes and tabs (Herdr manages its own in the other profile).
enabled_layouts splits,stack
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {index} {title}

# Existing shortcuts (kitty_mod = Ctrl+Shift).
map alt+0 goto_tab 10
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+backslash launch --location=vsplit --cwd=current
map alt+minus launch --location=hsplit --cwd=current
map ctrl+alt+down neighboring_window down
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+backspace send_text all \x17
map kitty_mod+t new_tab
map kitty_mod+w close_window
map kitty_mod+x toggle_layout stack
map kitty_mod+е new_tab
map kitty_mod+ц close_window
