# Launch separately: kitty --config ~/.config/kitty/herdr.conf herdr
include base.conf
include current-theme.conf

# Herdr owns workspaces, tabs, splits, pane focus, zoom and close actions.
# In particular, leave Ctrl+Shift+P available for Herdr Plus Projects.
clear_all_shortcuts yes

# Outer-terminal conveniences only; no native Kitty tab / pane management.
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+s paste_from_selection
map shift+insert paste_from_selection
map kitty_mod+equal change_font_size all +2.0
map kitty_mod+plus change_font_size all +2.0
map kitty_mod+minus change_font_size all -2.0
map kitty_mod+backspace change_font_size all 0
map kitty_mod+h show_scrollback
map kitty_mod+g show_last_command_output
map kitty_mod+u kitten hints
map kitty_mod+f5 load_config_file
map kitty_mod+f6 debug_config
map ctrl+shift+f11 toggle_fullscreen

# Keep the existing shell editing shortcut in both profiles.
map ctrl+backspace send_text all \x17
