# Shared settings for normal Kitty and Kitty as a Herdr frontend.
# Fonts and colors remain in current-theme.conf; keyboard shortcuts stay in profiles.

# Let kitty install shell integration automatically (prompt/command tracking).
shell_integration enabled no-cursor

# Only local socket clients may control kitty, not terminal escape sequences.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
# Warn before closing tabs / OS windows with running commands.
confirm_os_window_close -1
copy_on_select yes
cursor_blink_interval 0.8
cursor_shape block
hide_window_decorations yes
window_padding_width 4

# History: Ctrl+Shift+H opens less; / searches, q exits.
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
