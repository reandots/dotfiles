# Shared settings for normal Kitty and Kitty as a Herdr frontend.
# Fonts and colors remain in current-theme.conf; profile-specific shortcuts stay in entry configs.
# Theme library: ~/.config/kitty/theme/*.conf (copy, do not move).
# Switch: cp ~/.config/kitty/theme/<name>.conf ~/.config/kitty/current-theme.conf
# Reload the active Kitty profile with Ctrl+Shift+F5.
# Herdr: use its UI reload config action to refresh client-side theme settings.

# Let kitty install shell integration automatically (prompt/command tracking).
shell_integration enabled no-cursor

# Only local socket clients may control kitty, not terminal escape sequences.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
# Warn before closing tabs / OS windows with running commands.
confirm_os_window_close -1
copy_on_select yes
cursor_blink_interval 0.8
cursor_shape block
hide_window_decorations yes
window_padding_width 4

# History: Ctrl+Shift+H opens less; / searches, q exits.
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Клавиши редактирования передаём приложению.
map ctrl+shift+k no_op
map ctrl+shift+z no_op
# В legacy-режимах эти сочетания иначе теряют модификаторы.
map ctrl+shift+backspace send_text normal,application \x1b[127;6u
map shift+enter send_text normal,application \x1b[13;2u

# Ctrl+Shift+0 - reset font size
map ctrl+shift+0 change_font_size all 0
