# Solarized Dark Contrast — local high-contrast variant, not canonical Solarized.
# Original background and warm neutrals; ANSI accents retain their color families.
# Switch: copy this file to ~/.config/kitty/current-theme.conf, then Ctrl+Shift+F5.
font_family Ubuntu Mono
font_size 14

background #002b36
foreground #c4cccc
cursor #fdf6e3
cursor_text_color #002b36
selection_background #36535b
selection_foreground #fdf6e3
url_color #88d6c6

active_tab_background #a8bd5a
active_tab_foreground #002b36
inactive_tab_background #073642
inactive_tab_foreground #a8b8b8
tab_bar_background #002b36
active_border_color #62a9df
inactive_border_color #4c6269

# Normal ANSI colors: readable accents on the original dark background.
color0 #002731
color1 #f07178
color2 #a8bd5a
color3 #d6af5f
color4 #62a9df
color5 #d783b0
color6 #54b5a7
color7 #e9e2cb

# color8 is shared by dim text and TUI selection backgrounds: a compromise.
# tv: color10 on color8 = 4.82:1; search color9 on color8 = 4.63:1.
color8 #4c6269
color9 #ffd0c5
color10 #d0e89a
color11 #f2cf87
color12 #8dc9f0
color13 #efa9d2
color14 #88d6c6
color15 #fdf6e3

# Set these explicitly so switching from Tokyo Night leaves no stale overrides.
color16 #e9a56f
color17 #dc6f62
