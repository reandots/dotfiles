# Solarized Dark Contrast 2 — more saturated accents, not canonical Solarized.
# Accents gain OKLCH chroma at approximately the original perceptual lightness.
# Backgrounds, neutral text, and the color8 TUI compromise stay unchanged.
# Switch: copy this file to ~/.config/kitty/current-theme.conf, then Ctrl+Shift+F5.
font_family Ubuntu Mono
font_size 14

background #002b36
foreground #c4cccc
cursor #fdf6e3
cursor_text_color #002b36
selection_background #36535b
selection_foreground #fdf6e3
url_color #59dec7

active_tab_background #a5c007
active_tab_foreground #002b36
inactive_tab_background #073642
inactive_tab_foreground #a8b8b8
tab_bar_background #002b36
active_border_color #38aaf7
inactive_border_color #4c6269

# Normal ANSI accents: at least 5.16:1 against the main background.
color0 #002731
color1 #ff626f
color2 #a5c007
color3 #e3ab1e
color4 #38aaf7
color5 #e973b5
color6 #00bba9
color7 #e9e2cb

# color8 serves both dim text and TUI selection backgrounds; keep it stable.
# tv: color10 on color8 = 4.87:1; search color9 on color8 = 4.56:1.
# Bright red stays pale to preserve search readability on color8.
color8 #4c6269
color9 #ffcec2
color10 #caed70
color11 #ffcc59
color12 #78cbff
color13 #ff9dd8
color14 #59dec7
color15 #fdf6e3

# Explicit extended accents prevent stale overrides when switching themes.
color16 #ff9a3d
color17 #f15b4d
